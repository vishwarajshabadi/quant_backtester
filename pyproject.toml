[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-backtester"
version = "0.1.0"
description = "Event-driven backtesting engine for daily bar data"
requires-python = ">=3.10"
dependencies = [
    "python-dateutil>=2.8.2",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "yfinance>=0.2.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
